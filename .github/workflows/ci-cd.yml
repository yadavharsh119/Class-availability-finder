name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t classroom-availability-finder .

      - name: Start container
        run: |
          docker run -d --name caf -p 3000:3000 classroom-availability-finder
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Container is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become ready in time"
          docker logs caf
          exit 1

      - name: Smoke test /health
        run: |
          RESPONSE=$(curl -sf http://localhost:3000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' \
            || echo "$RESPONSE" | grep -q '"status": "ok"'

      - name: Stop container
        if: always()
        run: docker rm -f caf
